<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAWAB ZADA HACKER OSINT TOOL</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #050505;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            overflow-x: hidden;
        }
        /* Hacker Rain Canvas styling */
        #hackerCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            opacity: 0.15;
            pointer-events: none;
        }
        .glass-card {
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid #00ff00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
            border-radius: 12px;
        }
        .cyan-glow:focus {
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
            border-color: #00ff00 !important;
        }
        /* Graph Simulation Bar styling */
        .matrix-bar {
            height: 4px;
            background: linear-gradient(90deg, #00ff00, #003300);
            animation: pulseGraph 0.5s infinite ease-in-out alternate;
        }
        @keyframes pulseGraph {
            0% { transform: scaleX(0.3); }
            100% { transform: scaleX(1); }
        }
    </style>
</head>
<body>

    <canvas id="hackerCanvas"></canvas>

    <div id="mainDashboard" class="min-h-screen p-4 md:p-8 relative z-10">
        <div class="max-w-6xl mx-auto grid md:grid-cols-2 gap-8 mt-10">
            
            <div class="glass-card p-8 shadow-2xl border-green-500">
                <div class="flex items-center mb-6 text-green-400 border-b border-green-900 pb-4">
                    <i class="fas fa-shield-virus text-3xl mr-4 animate-pulse"></i>
                    <h2 class="text-2xl font-bold uppercase tracking-wider text-green-400">Breach Detector</h2>
                </div>
                <p class="text-sm text-gray-400 mb-6 font-light">Enter your Gmail to verify if your data exists in global leaked databases.</p>
                <input type="email" id="emailInput" placeholder="example@gmail.com" 
                    class="w-full bg-black/80 border border-green-800 p-4 rounded-xl cyan-glow outline-none transition-all text-green-400 placeholder-green-900 font-mono">
                <button onclick="checkEmail()" class="w-full mt-6 bg-green-900 border border-green-500 hover:bg-green-700 text-green-300 font-black py-4 rounded-xl transition-all active:scale-95 shadow-lg tracking-widest font-mono">
                    CLICK FOR SCAN DATA
                </button>
                <div id="emailResult" class="mt-6"></div>
            </div>

            <div class="glass-card p-8 shadow-2xl border-green-500">
                <div class="flex items-center mb-6 text-green-400 border-b border-green-900 pb-4">
                    <i class="fas fa-fingerprint text-3xl mr-4 animate-pulse"></i>
                    <h2 class="text-2xl font-bold uppercase tracking-wider text-green-400">OSINT Tracker</h2>
                </div>
                <p class="text-sm text-gray-400 mb-6 font-light">Trace digital footprints across multiple social media networks instantly.</p>
                <input type="text" id="userInput" placeholder="Username (e.g. nawabzada)" 
                    class="w-full bg-black/80 border border-green-800 p-4 rounded-xl cyan-glow outline-none transition-all text-green-400 placeholder-green-900 font-mono">
                <button onclick="checkUsername()" class="w-full mt-6 bg-green-900 border border-green-500 hover:bg-green-700 text-green-300 font-black py-4 rounded-xl transition-all active:scale-95 shadow-lg tracking-widest font-mono">
                    START FOOTPRINTING
                </button>
                <div id="userResult" class="mt-6 space-y-3 max-h-80 overflow-y-auto pr-2"></div>
            </div>
        </div>

        <div class="max-w-6xl mx-auto mt-12 p-4 border border-green-900/50 bg-black/70 rounded-lg text-center">
            <p class="text-green-500 text-xs font-mono uppercase tracking-widest">
                <i class="fas fa-exclamation-triangle mr-2 text-green-400 animate-flash"></i> Use this tool for educational and security awareness purposes only.
            </p>
        </div>

        <footer class="mt-16 text-center text-green-700">
            <p class="text-sm font-bold uppercase tracking-tighter font-mono">
                &copy; 2026 | Powered by <span class="text-green-400 text-glow">Nawab ZADA HACKER🔥🦅🙌</span>
            </p>
        </footer>
    </div>

    <script>
        // --- HACKER BACKGROUND RAIN EFFECT ---
        const canvas = document.getElementById('hackerCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789X0#@$&*%/";
        const fontSize = 14;
        const columns = canvas.width / fontSize;

        const rainDrops = [];
        for (let x = 0; x < columns; x++) {
            rainDrops[x] = 1;
        }

        const drawMatrix = () => {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#0F0'; 
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        };

        setInterval(drawMatrix, 30);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // --- GMAIL BREACH LOGIC ---
        async function checkEmail() {
            const email = document.getElementById('emailInput').value;
            const resDiv = document.getElementById('emailResult');
            if(!email || !email.includes('@')) { alert("Enter Your valid email!"); return; }

            resDiv.innerHTML = `<div class="flex flex-col p-4 bg-black border border-green-500 rounded-xl font-mono text-xs text-green-400 space-y-2">
                <div class="flex items-center"><span class="animate-spin mr-3 border-2 border-t-transparent border-green-500 rounded-full h-4 w-4"></span><span>ACCESSING DATA LEAK DATABASES...</span></div>
                <div class="w-full bg-green-950 h-1 mt-2 overflow-hidden"><div class="matrix-bar w-full"></div></div>
            </div>`;
            
            setTimeout(() => {
                resDiv.innerHTML = `<div class="p-4 bg-black border border-green-500 rounded-xl text-center font-mono">
                    <p class="text-green-400 text-sm mb-3 font-semibold uppercase tracking-wider">>>> SYSTEM CHECK COMPLETED <<<</p>
                    <button onclick="window.open('https://haveibeenpwned.com/account/${email}', '_blank')" class="bg-green-900 border border-green-400 hover:bg-green-600 text-green-300 px-6 py-2 rounded-lg text-xs font-bold transition-all tracking-widest">VIEW BREACH REPORT</button>
                </div>`;
            }, 1800);
        }

        // --- UPDATED OSINT TRACKER LOGIC ---
        async function checkUsername() {
            const user = document.getElementById('userInput').value;
            const resDiv = document.getElementById('userResult');
            if(!user) return alert("Jani, username likhna bhool gaye!");

            // Initial State: Hacker Graph Animation Terminal
            resDiv.innerHTML = `
                <div id="consoleLog" class="p-4 bg-black border border-green-500 rounded-xl font-mono text-xs text-green-400 space-y-2">
                    <div class="flex justify-between items-center text-[10px] text-green-600 mb-1">
                        <span>SYS_TRACKER_OSINT: v2.4</span>
                        <span class="animate-pulse">ONLINE</span>
                    </div>
                    <div class="space-y-1 text-[11px]">
                        <p>>>> [LOAD] Initializing footprint sequence for: "${user}"</p>
                        <p>>>> [SCAN] Injecting hooks into target nodes...</p>
                        <p>>>> [GRAPH] Generating network node mapping...</p>
                    </div>
                    <div class="grid grid-cols-6 gap-1 h-8 items-end pt-2 border-t border-green-900 pb-2">
                        <div class="matrix-bar" style="animation-delay: 0.1s;"></div>
                        <div class="matrix-bar" style="animation-delay: 0.4s;"></div>
                        <div class="matrix-bar" style="animation-delay: 0.2s;"></div>
                        <div class="matrix-bar" style="animation-delay: 0.6s;"></div>
                        <div class="matrix-bar" style="animation-delay: 0.3s;"></div>
                        <div class="matrix-bar" style="animation-delay: 0.5s;"></div>
                    </div>
                    <p class="text-center text-[10px] tracking-widest text-green-500 uppercase animate-pulse mt-2 border-b border-green-900 pb-2">CRAWLING SOCIAL TARGETS...</p>
                    <div id="platformsFound" class="space-y-3 mt-2"></div>
                </div>`;
            
            const platforms = [
                { name: 'Instagram', url: `https://www.instagram.com/${user}/`, icon: 'fa-instagram' },
                { name: 'GitHub', url: `https://github.com/${user}`, icon: 'fa-github' },
                { name: 'Twitter', url: `https://twitter.com/${user}`, icon: 'fa-twitter' },
                { name: 'Reddit', url: `https://www.reddit.com/user/${user}`, icon: 'fa-reddit' },
                { name: 'Snapchat', url: `https://www.snapchat.com/add/${user}`, icon: 'fa-snapchat' },
                { name: 'Pinterest', url: `https://www.pinterest.com/${user}/`, icon: 'fa-pinterest' },
                { name: 'Linktree', url: `https://linktr.ee/${user}`, icon: 'fa-link' }
            ];

            const foundDiv = document.getElementById('platformsFound');

            // Real-Time Sequential Scan Simulation
            for (let i = 0; i < platforms.length; i++) {
                await new Promise(resolve => setTimeout(resolve, 700)); // Smooth injection delay
                
                const p = platforms[i];
                foundDiv.innerHTML += `
                    <div class="flex justify-between items-center p-3 bg-black/50 border border-green-900 rounded-xl hover:border-green-400 transition-all group font-mono">
                        <div class="flex items-center">
                            <i class="fab ${p.icon} mr-3 text-green-500 text-base"></i>
                            <span class="text-xs font-medium text-green-400">${p.name}</span>
                        </div>
                        <a href="${p.url}" target="_blank" class="text-[10px] font-bold text-green-400 border border-green-500/50 px-3 py-1 rounded group-hover:bg-green-500 group-hover:text-black transition-all uppercase tracking-wider">
                            FETCH DATA
                        </a>
                    </div>`;
                
                // Keep target container focused/scrolled down
                resDiv.scrollTop = resDiv.scrollHeight;
            }

            // Final Success Box Message - Executes exactly after loop completes
            await new Promise(resolve => setTimeout(resolve, 400));
            resDiv.innerHTML += `
                <div class="p-3 bg-green-950/40 border-2 border-dashed border-green-400 rounded-xl text-center font-mono mt-4 animate-pulse">
                    <span class="text-green-400 text-xs font-black tracking-widest block uppercase">
                        <i class="fas fa-check-circle mr-2"></i> All Social Media User Name Found Successful
                    </span>
                </div>
            `;
            resDiv.scrollTop = resDiv.scrollHeight;
        }
    </script>
</body>
</html>
