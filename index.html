<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAWAB ZADA OSINT TOOL</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #050505; color: #00ff00; font-family: 'Courier New', Courier, monospace; overflow-x: hidden; }
        #hackerCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; opacity: 0.15; pointer-events: none; }
        .glass-card { background: rgba(10, 10, 10, 0.85); border: 1px solid #00ff00; box-shadow: 0 0 15px rgba(0, 255, 0, 0.2); border-radius: 12px; }
        .cyan-glow:focus { box-shadow: 0 0 15px rgba(0, 255, 0, 0.5); border-color: #00ff00 !important; }
        .matrix-bar { height: 4px; background: linear-gradient(90deg, #00ff00, #003300); animation: pulseGraph 0.5s infinite ease-in-out alternate; }
        @keyframes pulseGraph { 0% { transform: scaleX(0.3); } 100% { transform: scaleX(1); } }
        
        /* Tool Lock Screen Custom Styling */
        #toolLockScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div id="toolLockScreen">
        <div class="glass-card p-8 md:p-12 text-center max-w-md w-full border-green-500 shadow-2xl">
            <div class="mb-6 text-green-400">
                <i class="fas fa-lock text-5xl animate-bounce mb-4"></i>
                <h1 class="text-2xl font-black uppercase tracking-widest">Tool Locked 🔐</h1>
            </div>
            <p class="text-sm text-gray-400 mb-8 font-mono">To bypass security and access the OSINT Tool, you must follow My verification link below.</p>
            <a href="https://whatsapp.com/channel/0029VbB47ttDDmFNztpnZf2m" target="_blank" onclick="unlockDashboard()" 
               class="block w-full bg-green-900 border border-green-500 hover:bg-green-700 text-green-300 font-black py-4 rounded-xl transition-all active:scale-95 shadow-lg tracking-widest font-mono text-xs md:text-sm uppercase text-center">
                <i class="fab fa-whatsapp text-lg mr-2"></i> follow my whatspp channel to unlock this tool
            </a>
        </div>
    </div>
    <canvas id="hackerCanvas"></canvas>

    <div id="mainDashboard" class="min-h-screen p-4 md:p-8 relative z-10" style="display: none;">
        <div class="max-w-6xl mx-auto grid md:grid-cols-2 gap-8 mt-10">
            
            <div class="glass-card p-8 shadow-2xl border-green-500">
                <div class="flex items-center mb-6 text-green-400 border-b border-green-900 pb-4">
                    <i class="fas fa-shield-virus text-3xl mr-4 animate-pulse"></i>
                    <h2 class="text-2xl font-bold uppercase tracking-wider text-green-400">EMail Check</h2>
                </div>
                <input type="email" id="emailInput" placeholder="example@gmail.com" class="w-full bg-black/80 border border-green-800 p-4 rounded-xl cyan-glow outline-none transition-all text-green-400 placeholder-green-900 font-mono">
                <button onclick="checkEmail()" class="w-full mt-6 bg-green-900 border border-green-500 hover:bg-green-700 text-green-300 font-black py-4 rounded-xl transition-all active:scale-95 shadow-lg tracking-widest font-mono">Click for SCAN</button>
                <div id="emailResult" class="mt-6"></div>
            </div>

            <div class="glass-card p-8 shadow-2xl border-green-500">
                <div class="flex items-center mb-6 text-green-400 border-b border-green-900 pb-4">
                    <i class="fas fa-fingerprint text-3xl mr-4 animate-pulse"></i>
                    <h2 class="text-2xl font-bold uppercase tracking-wider text-green-400">OSINT Tracker</h2>
                </div>
                <input type="text" id="userInput" placeholder="Username (e.g. @nawabzada)" class="w-full bg-black/80 border border-green-800 p-4 rounded-xl cyan-glow outline-none transition-all text-green-400 placeholder-green-900 font-mono">
                <button onclick="checkUsername()" class="w-full mt-6 bg-green-900 border border-green-500 hover:bg-green-700 text-green-300 font-black py-4 rounded-xl transition-all active:scale-95 shadow-lg tracking-widest font-mono">START FOOTPRINTING</button>
                <div id="userResult" class="mt-6 space-y-3 max-h-80 overflow-y-auto pr-2"></div>
            </div>
        </div>

        <footer class="mt-16 text-center text-green-700 font-mono text-sm">
            <p>© 2026 | Powered by Nawab ZADA HACKER🔥🦅🙌</p>
        </footer>
    </div>

    <script>
        // --- TOOL UNLOCK FUNCTION ---
        function unlockDashboard() {
            // Dynamic sequence triggers unlock status
            setTimeout(() => {
                document.getElementById('toolLockScreen').style.display = 'none';
                document.getElementById('mainDashboard').style.display = 'block';
            }, 500);
        }

        const canvas = document.getElementById('hackerCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789X0#@$&*%/";
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const rainDrops = Array(Math.floor(columns)).fill(1);
        
        const drawMatrix = () => {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.05)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0F0'; ctx.font = fontSize + 'px monospace';
            rainDrops.forEach((y, i) => {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillText(text, i * fontSize, y * fontSize);
                if (y * fontSize > canvas.height && Math.random() > 0.975) rainDrops[i] = 0;
                rainDrops[i]++;
            });
        };
        setInterval(drawMatrix, 30);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        async function checkEmail() {
            const email = document.getElementById('emailInput').value;
            const resDiv = document.getElementById('emailResult');
            if(!email) return;
            resDiv.innerHTML = `<div class="p-4 bg-black border border-green-500 rounded text-green-400 text-xs">Scanning...</div>`;
            setTimeout(() => {
                resDiv.innerHTML = `<div class="p-4 bg-black border border-green-500 rounded text-center"><button onclick="window.open('https://haveibeenpwned.com/account/${email}', '_blank')" class="bg-green-900 border border-green-400 text-green-300 px-6 py-2 rounded text-xs font-bold">VIEW REPORT</button></div>`;
            }, 1800);
        }

        async function checkUsername() {
            const user = document.getElementById('userInput').value;
            const resDiv = document.getElementById('userResult');
            if(!user) return alert("Enter Username for Scan!");

            resDiv.innerHTML = `<div id="consoleLog" class="p-4 bg-black border border-green-500 rounded font-mono text-xs text-green-400"><p>>>> Initializing Global Footprint Scan...</p><div id="platformsFound" class="space-y-2 mt-4"></div></div>`;
            
            // Comprehensive Global Social Scan Array Including TikTok and missing links
            const platforms = [
                { name: 'Instagram', url: `https://www.instagram.com/${user}/`, icon: 'fa-instagram' },
                { name: 'TikTok', url: `https://www.tiktok.com/@${user}`, icon: 'fa-tiktok' },
                { name: 'YouTube', url: `https://www.youtube.com/@${user}`, icon: 'fa-youtube' },
                { name: 'Snapchat', url: `https://www.snapchat.com/add/${user}`, icon: 'fa-snapchat' },
                { name: 'GitHub', url: `https://github.com/${user}`, icon: 'fa-github' },
                { name: 'Twitter', url: `https://twitter.com/${user}`, icon: 'fa-twitter' },
                { name: 'Facebook', url: `https://www.facebook.com/${user}`, icon: 'fa-facebook' },
                { name: 'Reddit', url: `https://www.reddit.com/user/${user}`, icon: 'fa-reddit' },
                { name: 'Telegram', url: `https://t.me/${user}`, icon: 'fa-telegram' },
                { name: 'Twitch', url: `https://www.twitch.tv/${user}`, icon: 'fa-twitch' },
                { name: 'Pinterest', url: `https://www.pinterest.com/${user}/`, icon: 'fa-pinterest' }
            ];

            const foundDiv = document.getElementById('platformsFound');
            for (let p of platforms) {
                await new Promise(r => setTimeout(r, 500));
                foundDiv.innerHTML += `
                    <div class="flex justify-between items-center p-2 border border-green-900 rounded bg-black/50">
                        <span><i class="fab ${p.icon} mr-2"></i>${p.name}</span>
                        <a href="${p.url}" target="_blank" class="text-[9px] border px-2 py-0.5 border-green-500 rounded">CHECK</a>
                    </div>`;
                resDiv.scrollTop = resDiv.scrollHeight;
            }

            resDiv.innerHTML += `<div class="p-2 border-2 border-dashed border-green-400 text-center animate-pulse mt-4"><span class="text-xs uppercase font-bold">All Social Media User Name Found Successful</span></div>`;
            resDiv.scrollTop = resDiv.scrollHeight;
        }
    </script>
</body>
</html>
